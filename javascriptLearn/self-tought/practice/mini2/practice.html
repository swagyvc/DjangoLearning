<!--
Task 1: The Emoji Changer (Easiest)Create a page where clicking a button changes a boring emoji into a cool one.
HTML: One <p> tag containing a 😐 emoji, and one <button> that says "Make Happy".JS 
Goal: Use querySelector to find both elements. Add a click listener to the button. 
Change the .textContent of the paragraph to 😎
-->
<!DOCTYPE html>
<html>
    <head>
        <title>Mini 2 Practice</title>
        <style>
            .icon {
                font-size: 30px;
                border: none;
                padding: 20px;
            }
        </style>
    </head>
    <body>
        <p class = "icon">😔</p>
        <button class = "change-button">Make Happy</button>
        <script>
            const myButton = document.querySelector('.change-button');
            const myIcon = document.querySelector('.icon');
            
            myButton.addEventListener('click', function() {
                if (myIcon.textContent === '😔') {
                    myIcon.innerHTML = '😊';
                    myButton.innerHTML = 'Make Sad';
                } else {
                    myIcon.innerHTML = '😔';
                    myButton.innerHTML = 'Make Happy';
                }
            })
            
        </script>
    </body>
</html>
