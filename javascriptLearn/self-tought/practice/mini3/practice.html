Task
1. Color Changer
Features:
Button changes page background color.
Display current color code.
-->
<!DOCTYPE html>
<html>
<head>
    <title>Color Changer</title>

    <style>
          body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            transition: background-color 0.5s ease;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
    </style>
</head>

<body>
    <h1>Background Color Changer</h1>
    <p id="colorCode">Current Color: #FFFFFF</p>
    <button>Color Change</button>
    
    <script>   
        //Generate a random hexadecimal color.
        //start with # + 6 characters.
        //0123456789ABCDEF
        const myButton = document.querySelector('button');
        const colorContext = document.querySelector('#colorCode');

        function randomColor(){
            const letter = "0123456789ABCDEF";
            let color = "#";

            for (let i = 0; i < 6; i++){
                const randomIndex = Math.floor(Math.random() * 16);
                color += letter[randomIndex];
            }
            return color
        }

        myButton.addEventListener('click', function(){
            const newColor = randomColor();

            document.body.style.backgroundColor = newColor;
            colorCode.textContent = "Current Color: " + newColor;
        })
    </script>

</body>
</html>
