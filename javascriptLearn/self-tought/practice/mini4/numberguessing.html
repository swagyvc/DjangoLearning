<!DOCTYPE html>
<html>
    <head>
        <title>User Input Practice</title>
    </head>
    <body>
        <h1>Display User Input</h1>
        <input type = "number" id = "user-input" placeholder="Enter a Number">
        <button id = "show-number-button">Show Number</button>

        <p id ="user-input-display"></p>
        
        <script>
            const userInput = document.querySelector('#user-input');
            const showButton = document.querySelector('#show-number-button');
            const display = document.querySelector('#user-input-display');
            
            showButton.addEventListener('click', function() {
                const numberInput = userInput.value;
                
                display.textContent = "Your Number: " + numberInput;

                userInput.value = "";
            })

        </script>
    </body>
</html>
