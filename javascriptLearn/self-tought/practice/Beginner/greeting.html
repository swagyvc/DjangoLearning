<!DOCTYPE html>
<html>
    <head>
        <title>Greeting Practice</title>
    </head>
    <body>
        <h1>Greeting APP</h1>
    
        <input type = "text" id ="name-input" placeholder = "Enter Name">
        <button id = "greet-button">Greet</button>
        <p id = "display-greet"></p>
      
      <script>
            const inputName = document.querySelector('#name-input');
            const greetButton = document.querySelector('#greet-button');
            const greetDisplay = document.querySelector('#display-greet');

            greetButton.addEventListener('click', function(){
                const userInput = inputName.value;
                
                if (userInput === "") {
                    greetDisplay.textContent = "Please enter your name."
                } else {
                    greetDisplay.textContent = "Hello, " + userInput + "!";
                }
            })
        </script>
    </body>
</html>
