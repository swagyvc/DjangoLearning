<!DOCTYPE html>
<html>
<head>
    <title>Practice</title>
    <!-- Your CSS file is linked here -->
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <!-- 1. The HTML Structure -->
    <input class="name-input" placeholder="Full Name">
    <button>Add</button>
    <p class="show-name"></p>

    <!-- 2. The Basic JavaScript -->
    <script>
        // Find the HTML elements using their tags or classes (remember the dot for classes!)
        const myInput = document.querySelector('.name-input');
        const myButton = document.querySelector('button');
        const myParagraph = document.querySelector('.show-name');

        // Wait for the user to click the button
        myButton.addEventListener('click', function() {
            
            // Get the text that was typed into the input box
            const textTyped = myInput.value;

            // Put that text inside the empty paragraph tag
            myParagraph.textContent = textTyped;
            
            // Optional: Clear the input box so you can type a new name
            myInput.value = '';
        });
    </script>

</body>
</html>
