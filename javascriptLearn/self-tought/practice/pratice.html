<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Name Inserter</title>
  <link rel = stylesheet href = "style.css">
</head>
<body>

  <!-- 2. HTML: Creating the structure -->
  <div class="card">
    <h3>Enter Your Name</h3>
    <input type="text" id="nameInput" placeholder="Type name here...">
    <button id="submitBtn">Display Name</button>
    
    <!-- Empty area where JS will insert the name -->
    <div id="displayName"></div>
  </div>

  <!-- 3. JAVASCRIPT: Making it interactive -->
  <script>
    // Target the HTML elements using their IDs
    const button = document.getElementById('submitBtn');
    const input = document.getElementById('nameInput');
    const displayArea = document.getElementById('displayName');

    // Listen for the user to click the button
    button.addEventListener('click', function() {
      // Get the value typed into the input field
      const userName = input.value;

      // Clear previous content and append the text using modern .append()
      displayArea.textContent = ''; 
      displayArea.append(`Hello, ${userName}!`);

      // Clear the input box for the next entry
      input.value = '';
    });
  </script>

</body>
</html>
